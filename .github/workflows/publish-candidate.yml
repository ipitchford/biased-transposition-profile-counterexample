name: Publish reviewed candidate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-candidate.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package the immutable reviewed tag
        run: |
          mkdir -p release-assets
          cp publication-assets/* release-assets/
          test "$(sha256sum release-assets/biased-transposition-profile-counterexample-1.0.1-candidate.zip | cut -d' ' -f1)" = 34ed6762cb23f731532649a8727295f87e3e3ece99504b11f7a9745c55fcf7dd
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
      - name: Publish candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1-candidate release-assets/* --verify-tag --prerelease --title 'Subset profile counterexample — 1.0.1 candidate' --notes 'Unrefereed candidate counterexample to the Nestoridi–Yan profile conjecture in arXiv:2409.16387v1. Written proof, exact inequalities, 23 hostile controls and producer finite replay. No replacement profile, general sharp upper bound, formal verification, external reproduction or priority is claimed. Original prose/data CC0-1.0; original code MIT; inherited inputs retain their rights. Version DOI: https://doi.org/10.5281/zenodo.22708622'
